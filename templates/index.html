<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTWEB_X — FTBUGRECON Web GUI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Matrix rain background -->
    <canvas id="matrix"></canvas>

    <!-- Header -->
    <header>
        <div class="logo">
            <span class="skull">&#9760;</span>
            <h1>FTWEB_X</h1>
            <span class="subtitle">GOD OF BUG BOUNTY RECON — WEB GUI</span>
        </div>
        <div class="status-bar">
            <span class="status-item" id="serverStatus">
                <span class="dot"></span> SERVER: CHECKING...
            </span>
            <span class="status-item" id="binaryStatus">
                <span class="dot"></span> BINARY: CHECKING...
            </span>
        </div>
    </header>

    <!-- Control Panel -->
    <section class="control-panel">
        <div class="input-group">
            <label for="target">TARGET (URL or Domain)</label>
            <input type="text" id="target" placeholder="example.com" autocomplete="off">
        </div>
        <div class="button-group">
            <button id="startBtn" class="btn btn-primary">
                <span class="btn-icon">&#9654;</span> START SCAN
            </button>
            <button id="stopBtn" class="btn btn-danger" disabled>
                <span class="btn-icon">&#9632;</span> STOP
            </button>
            <button id="clearBtn" class="btn btn-secondary">
                <span class="btn-icon">&#128465;</span> CLEAR
            </button>
        </div>
    </section>

    <!-- Stats -->
    <section class="stats">
        <div class="stat">
            <span class="stat-label">STATUS</span>
            <span class="stat-value" id="scanStatus">IDLE</span>
        </div>
        <div class="stat">
            <span class="stat-label">TARGET</span>
            <span class="stat-value" id="scanTarget">—</span>
        </div>
        <div class="stat">
            <span class="stat-label">LINES</span>
            <span class="stat-value" id="lineCount">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">TIME</span>
            <span class="stat-value" id="elapsed">00:00</span>
        </div>
    </section>

    <!-- Output Terminal -->
    <section class="terminal-wrapper">
        <div class="terminal-header">
            <span class="term-dot red"></span>
            <span class="term-dot yellow"></span>
            <span class="term-dot green"></span>
            <span class="term-title">ftbugrecon@localhost — live output</span>
        </div>
        <div class="terminal" id="output">
            <div class="term-line term-welcome">
                <span class="term-prompt">$</span> FTWEB_X ready. Enter target and click START SCAN.
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <span>Made by <strong>BLOODRAVENIST</strong></span>
        <a href="https://buymeacoffee.com/bloodravenist" target="_blank" class="bmc">
            &#9749; Buy Me A Coffee
        </a>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
